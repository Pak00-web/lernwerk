<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernwerk</title>
<meta name="description" content="Lernwerk – Lernen für die FIAE-Klasse am Berufskolleg Bocholt-West">
<meta name="theme-color" content="#0B1026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<header class="top">
  <div class="top-in">
    <button class="brand" id="homeBtn" aria-label="Zur Startseite">
      <div class="brand-mark" id="logo"></div>
      <b class="brand-name">Lernwerk</b>
    </button>
    <span class="brand-schule">FIAE – Berufskolleg Bocholt-West</span>
    <div class="chips">
      <span class="chip flame" id="streakChip" title="Lern-Serie in Tagen"></span>
      <span class="chip lvl" id="lvlChip" title="Level und Erfahrungspunkte"></span>
      <button class="iconbtn" id="abzBtn" aria-label="Abzeichen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9.5 18h5"/></svg></button>
      <button class="iconbtn" id="tonBtn" aria-label="Töne"></button>
      <button class="iconbtn" id="themeBtn" aria-label="Hell/Dunkel umschalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <span id="kontoSlot"></span>
    </div>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Hauptmenü"></nav>
  <main id="app" aria-live="polite"></main>
  <aside class="rail" id="rail"></aside>
</div>
<nav class="tabbar" id="tabbar" aria-label="Menü"></nav>
<div class="toast" id="toast" role="status"></div>
<canvas id="confetti" hidden></canvas>

<script src="js/config.js"></script>
<script src="fragen.js"></script>
<script src="js/grafik.js"></script>
<script src="js/spiel.js"></script>
<script src="js/app.js"></script>
<script src="js/konto.js"></script>
<script src="js/duell.js"></script>
</body>
</html>
